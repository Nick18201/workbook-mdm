<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>FormesDeFond</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..900;1,9..40,400&family=Manrope:wght@400..800&family=PT+Mono&family=Instrument+Serif:ital@1&display=swap">
<style>.z{position:relative;height:320px;overflow:hidden;background:var(--surface)} .z .d1{position:absolute;right:-120px;top:-110px;width:360px;height:360px;border-radius:var(--radius-full);background:var(--pastel-jasmine)} .z .d2{position:absolute;left:-90px;bottom:-130px;width:300px;height:300px;border-radius:var(--radius-full);background:var(--pastel-almond);opacity:.7} .z svg{position:absolute;left:46%;top:-30px;width:120px;height:150px;overflow:visible} .z svg path{fill:none;stroke:var(--pastel-sky);stroke-width:80px;stroke-linecap:round} .z .photo{position:absolute;left:300px;top:110px;width:240px;height:150px;border-radius:var(--radius-page);background:var(--surface-alt);box-shadow:var(--shadow-bento)} .z .dot{position:absolute;left:272px;top:157px;width:56px;height:56px;border-radius:var(--radius-full);background:var(--brand-coral)}</style>
</head>
<body>
<div class="z" aria-hidden="true">
  <div class="d1"></div><div class="d2"></div>
  <svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M62 0C62 45 38 55 38 100" vector-effect="non-scaling-stroke"/></svg>
  <div class="photo"></div><div class="dot"></div>
</div>
</body>
</html>
