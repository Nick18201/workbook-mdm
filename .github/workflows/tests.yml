name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Tests (compilateur et API)
        run: python -m pytest tests

      - name: Générer les documents CLI
        run: |
          for script in Scripts/main_generate_*.py; do
            python "$script" --output "$RUNNER_TEMP/$(basename "$script" .py).pdf"
          done
