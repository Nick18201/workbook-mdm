<?xml version="1.0" encoding="UTF-8"?>
<!--
  Illustration des couvertures : la table de travail vue du dessus.
  Unités : points PDF. Le cadre couvre la largeur d'une page A4 et ses 500 premiers points
  en partant du haut ; le coin haut gauche reste libre pour le logotype, et le bas gauche
  pour le post-it de la promesse, dessiné par le code.
  Le lilas #E7E0FF est la couleur dominante du document : le code la remplace par le
  pastel du carnet. Ne pas l'employer pour autre chose dans ce fichier.
  Rendu en vectoriel par svglib (primitives.draw_cover_illustration) : s'en tenir aux
  formes simples, aux chemins, aux transformations et aux opacités. Pas de texte, de
  dégradé, de filtre ni de masque. Couleurs de la palette uniquement (DA-workbook.md).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="595.28pt" height="500pt" viewBox="0 0 595.28 500">

  <!-- Grand disque pastel coupé par les bords -->
  <circle cx="474" cy="196" r="236" fill="#E7E0FF"/>

